<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>make.fun — bounties, leaderboards, profiles</title>
<meta name="description" content="A fast, read-only frontend for make.fun: live bounty board, bounty pages with live rewards, leaderboards with confidence intervals, and public profiles.">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">make<span>.fun</span></a>
  <nav class="topnav" aria-label="Sections">
    <a href="#/" data-nav="board">Board</a>
    <a href="#/u/ronigrv" data-nav="profile">Profiles</a>
    <a class="ext" href="https://make.fun" target="_blank" rel="noopener">make.fun ↗</a>
  </nav>
  <form class="lookup" id="profile-lookup" role="search" aria-label="Find a profile">
    <input id="lookup-handle" type="search" placeholder="Find a profile: handle…" aria-label="Profile handle" autocomplete="off" spellcheck="false">
    <button type="submit">Go</button>
  </form>
</header>
<main id="view" aria-live="polite">
  <div class="loading" role="status">Loading live bounties…</div>
</main>
<footer class="foot">
  <span>Data: make.fun public API · read-only · no sign-in · answers revalidated with ETags.</span>
  <span>Built for the <a href="https://make.fun/bounty/makefun-frontend-01">make.fun frontend bounty</a>.</span>
</footer>
<script type="module" src="./main.js"></script>
</body>
</html>
